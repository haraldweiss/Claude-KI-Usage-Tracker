#
# CI — runs the backend (jest) and frontend (vitest) suites plus the TypeScript
# type-checks on every push to main and on every pull request (including
# Dependabot PRs, so dependency bumps are validated before they are merged).
#
# Added 2026-09-29 together with the `pino-pretty` devDependency fix: without
# pino-pretty in backend/devDependencies, pino's transport resolves it at import
# time and 27 of 38 backend suites failed with
# `unable to determine transport target for "pino-pretty"`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (jest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --run
